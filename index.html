<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Fuego Entretenimento • Esteira de Edição</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: #0b0e14;
            color: #eef2ff;
            min-height: 100vh;
            position: relative;
        }

        /* Imagem de fundo personalizada - ajuste opacity e position conforme desejar */
        body::before {
            content: "";
            background-image: url('https://parakakau.github.io/fuego/images/bg-fuego.png'); /* SUBSTITUA PELO LINK DA SUA IMAGEM */
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center center;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.05;
            pointer-events: none;
            z-index: 0;
        }

        /* Layout com menu lateral fixo */
        .app-container {
            display: flex;
            min-height: 100vh;
            position: relative;
            z-index: 2;
            flex-direction: column;
        }

        /* Menu lateral (sidebar mais larga e com fonte maior) */
        .sidebar {
            width: 320px;          /* aumentado de 260px */
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(12px);
            border-right: 1px solid #1e293b;
            padding: 2rem 1.5rem;
            position: sticky;
            top: 0;
            height: 100vh;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }
        .sidebar h2 {
            font-size: 2rem;       /* maior */
            font-weight: 700;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: #facc15;
            letter-spacing: 1px;
        }
        .sidebar nav ul {
            list-style: none;
        }
        .sidebar nav li {
            margin-bottom: 0.75rem;
        }
        .filter-btn {
            background: transparent;
            border: none;
            color: #cbd5e1;
            padding: 0.8rem 1rem;
            width: 100%;
            text-align: left;
            border-radius: 0.75rem;
            cursor: pointer;
            font-size: 1rem;        /* fonte maior */
            font-weight: 500;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .filter-btn:hover {
            background: #1e293b;
            color: white;
        }
        .filter-btn.active {
            background: #4f46e5;
            color: white;
        }
        .new-demand-sidebar {
            margin-top: 2rem;
            padding-top: 1rem;
            border-top: 1px solid #334155;
        }
        .new-demand-btn {
            background: #4f46e5;
            border: none;
            width: 100%;
            padding: 0.8rem;
            border-radius: 2rem;
            font-weight: 700;
            font-size: 1rem;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        /* Conteúdo principal */
        .main-content {
            flex: 1;
            padding: 1rem 1.5rem;
            overflow-x: auto;
        }
        .header-main {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 1.8rem;
            flex-wrap: wrap;
            gap: 0.5rem;
        }
        .header-main h1 {
            font-size: 2.2rem;
            font-weight: 800;
            background: linear-gradient(135deg, #ffffff, #c084fc);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: -0.5px;
            text-transform: uppercase;
            font-family: 'Poppins', 'Inter', system-ui, sans-serif;
        }
        .current-filter {
            background: #1e293b;
            padding: 0.4rem 1.2rem;
            border-radius: 2rem;
            font-size: 0.9rem;
        }

        /* Rodapé fixo na parte inferior */
        .footer {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(8px);
            border-top: 1px solid #2d3a4a;
            text-align: center;
            padding: 0.8rem;
            font-size: 0.85rem;
            color: #94a3b8;
            letter-spacing: 0.5px;
            margin-top: auto;
        }
        .footer span {
            font-size: 1rem;
            margin-right: 0.3rem;
        }

        /* Ajuste do container principal para permitir rodapé fixo inferior */
        .app-container {
            display: flex;
            min-height: 100vh;
            flex-direction: column;
        }
        .flex-grow {
            flex: 1;
            display: flex;
        }

        /* Kanban colunas */
        .kanban-board {
            display: flex;
            gap: 1rem;
            overflow-x: auto;
            padding-bottom: 1rem;
        }
        .column {
            background: rgba(30, 41, 59, 0.5);
            backdrop-filter: blur(4px);
            border-radius: 1rem;
            min-width: 320px;
            width: 340px;
            flex-shrink: 0;
            border: 1px solid #2d3a4a;
            display: flex;
            flex-direction: column;
            max-height: 70vh;
        }
        .column-header {
            padding: 0.8rem 1rem;
            font-weight: 600;
            border-bottom: 1px solid #334155;
            display: flex;
            justify-content: space-between;
            background: rgba(15, 23, 42, 0.6);
            border-radius: 1rem 1rem 0 0;
        }
        .cards-list {
            flex: 1;
            overflow-y: auto;
            padding: 0.8rem;
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }
        .card-item {
            background: #0f172a;
            border-radius: 0.9rem;
            padding: 0.9rem;
            cursor: pointer;
            transition: 0.1s;
            border-left: 3px solid #4f46e5;
        }
        .card-item:hover {
            background: #1e293b;
            transform: translateY(-2px);
        }
        .card-title {
            font-weight: 600;
            font-size: 0.95rem;
            margin-bottom: 0.2rem;
        }
        .card-labels {
            display: flex;
            gap: 0.3rem;
            margin: 0.3rem 0;
            flex-wrap: wrap;
        }
        .label-badge {
            font-size: 0.65rem;
            padding: 0.2rem 0.5rem;
            border-radius: 1rem;
            background: #334155;
            color: #e2e8f0;
        }
        .card-desc {
            font-size: 0.8rem;
            color: #94a3b8;
            margin-top: 0.3rem;
            line-height: 1.3;
        }
        .empty-column {
            text-align: center;
            color: #64748b;
            padding: 1rem;
            font-size: 0.8rem;
        }

        /* Modal de formulário e detalhes */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(8px);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: #0f172a;
            max-width: 700px;
            width: 95%;
            max-height: 85vh;
            border-radius: 1.5rem;
            padding: 1.8rem;
            overflow-y: auto;
            border: 1px solid #334155;
            box-shadow: 0 20px 35px -12px black;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 1.2rem;
        }
        .close-modal {
            font-size: 1.8rem;
            cursor: pointer;
            color: #94a3b8;
        }
        .form-group {
            margin-bottom: 1rem;
        }
        label {
            font-weight: 500;
            font-size: 0.85rem;
            display: block;
            margin-bottom: 0.3rem;
            color: #cbd5e1;
        }
        input, textarea, select {
            width: 100%;
            padding: 0.8rem 1rem;
            border: 1px solid #334155;
            border-radius: 0.75rem;
            background: #1e293b;
            color: #f1f5f9;
            font-size: 0.95rem;
        }
        button[type="submit"] {
            background: #4f46e5;
            border: none;
            width: 100%;
            padding: 0.8rem;
            border-radius: 2rem;
            font-weight: 600;
            font-size: 1rem;
            color: white;
            cursor: pointer;
            margin-top: 0.5rem;
        }
        .comments-section {
            margin-top: 1.5rem;
            border-top: 1px solid #334155;
            padding-top: 1rem;
        }
        .comment {
            background: #1e293b;
            border-radius: 0.8rem;
            padding: 0.6rem;
            margin-bottom: 0.6rem;
        }
        .comment-author {
            font-weight: bold;
            font-size: 0.7rem;
            color: #facc15;
        }
        .comment-text {
            font-size: 0.85rem;
            margin-top: 0.2rem;
        }
        .new-comment-form {
            display: flex;
            gap: 0.5rem;
            margin-top: 1rem;
        }
        .new-comment-form input {
            flex: 1;
            background: #1e293b;
            border: 1px solid #4f46e5;
            padding: 0.6rem 1rem;
            border-radius: 2rem;
            color: white;
        }
        .new-comment-form button {
            background: #4f46e5;
            border: none;
            padding: 0 1.2rem;
            border-radius: 2rem;
            cursor: pointer;
            color: white;
        }
        @media (max-width: 768px) {
            .sidebar { width: 240px; padding: 1rem; }
            .sidebar h2 { font-size: 1.6rem; }
            .filter-btn { font-size: 0.9rem; padding: 0.6rem 0.8rem; }
            .main-content { padding: 0.8rem; }
            .column { min-width: 280px; width: 300px; }
            .header-main h1 { font-size: 1.6rem; }
        }
    </style>
</head>
<body>
<div class="app-container">
    <div class="flex-grow">
                <aside class="sidebar">
            <h2>🔥 FUEGO</h2>
            <nav>
                <ul id="listFilterMenu">
                    <li><button class="filter-btn active" data-list-id="all">📋 Todas as listas</button></li>
                    <!-- As listas serão inseridas via JS -->
                </ul>
            </nav>
            <div class="new-demand-sidebar">
                <button class="new-demand-btn" id="openModalBtn">+ Nova demanda</button>
            </div>
                        <div style="margin-top: auto; padding-top: 2rem; text-align: center; font-size: 1.1rem; font-weight: 500; color: #94a3b8; letter-spacing: 1px;">
                <span>🔥</span> Fuego Entertainment
            </div>
        </aside>
        <main class="main-content">
            <div class="header-main">
                <h1>ESTEIRA DE EDIÇÃO</h1>
                <div class="current-filter" id="currentFilterLabel">Mostrando: Todas as listas</div>
            </div>
            <div class="kanban-board" id="kanbanBoard">
                <div style="text-align:center; width:100%;">Carregando quadro...</div>
            </div>
        </main>
    </div>
    
</div>

<!-- Modal de formulário -->
<div id="demandaModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h2>📝 Nova demanda</h2>
            <span class="close-modal" id="closeModalBtn">&times;</span>
        </div>
        <form id="demandaForm">
            <div class="form-group">
                <label>Nome do Cliente *</label>
                <input type="text" name="nome_cliente" required>
            </div>
            <div class="form-group">
                <label>Descrição da Tarefa *</label>
                <textarea name="descricao" rows="3" required></textarea>
            </div>
            <div class="form-group">
                <label>Link do Material Bruto</label>
                <input type="url" name="link_material" placeholder="https://...">
            </div>
            <div class="form-group">
                <label>Data de Entrega Desejada</label>
                <input type="date" name="data_entrega">
            </div>
            <div class="form-group">
                <label>Comentários</label>
                <textarea name="comentarios" rows="2"></textarea>
            </div>
            <div class="form-group">
                <label>Tipo de serviço</label>
                <select name="pergunta">
                    <option value="Opção 1">🎥 Edição de vídeo</option>
                    <option value="Opção 2">📸 Fotografia</option>
                    <option value="Opção 3">🎨 Design</option>
                    <option value="Outro">⚙️ Outro</option>
                </select>
            </div>
            <button type="submit">Enviar demanda</button>
            <div id="loadingModal" style="display:none; text-align:center; margin-top:0.8rem;">Enviando...</div>
        </form>
    </div>
</div>

<!-- Modal de detalhes + comentários -->
<div id="cardModal" class="modal">
    <div class="modal-content" id="cardModalContent">
        <!-- preenchido via JS -->
    </div>
</div>

<script>
    // ========== CONFIGURAÇÃO ==========
    // ⚠️ SUBSTITUA PELA URL DO SEU GOOGLE APPS SCRIPT (Web App)
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyQRrto89RvqbypZCRXVgxxLr6-4j4EcBfBRSvqMphtCVNM8DcTc85LxA1dk0l_tCtL/exec';
    
    let todasListas = [];
    let todosCards = [];
    let listaFiltradaId = 'all';

    const boardContainer = document.getElementById('kanbanBoard');
    const filterMenu = document.getElementById('listFilterMenu');
    const currentFilterLabel = document.getElementById('currentFilterLabel');

    // Modal de formulário
    const modalForm = document.getElementById('demandaModal');
    const openBtn = document.getElementById('openModalBtn');
    const closeBtn = document.getElementById('closeModalBtn');
    openBtn.onclick = () => modalForm.style.display = 'flex';
    closeBtn.onclick = () => modalForm.style.display = 'none';
    window.onclick = (e) => { if (e.target === modalForm) modalForm.style.display = 'none'; };

    // Envio do formulário
    const form = document.getElementById('demandaForm');
    form.onsubmit = async (e) => {
        e.preventDefault();
        const loading = document.getElementById('loadingModal');
        loading.style.display = 'block';
        const formData = new FormData(form);
        const params = new URLSearchParams(formData);
        try {
            const res = await fetch(SCRIPT_URL, { method: 'POST', body: params });
            const data = await res.json();
            if (data.status === 'success') {
                alert('✅ Demanda criada com sucesso!');
                form.reset();
                modalForm.style.display = 'none';
                carregarBoard();
            } else {
                alert('❌ Erro: ' + JSON.stringify(data));
            }
        } catch (err) {
            alert('⚠️ Falha na conexão: ' + err.message);
        } finally {
            loading.style.display = 'none';
        }
    };

    // Buscar listas e cards
    async function carregarBoard() {
        boardContainer.innerHTML = '<div style="text-align:center;">🔄 Carregando...</div>';
        try {
            const response = await fetch(`${SCRIPT_URL}?action=board`);
            const data = await response.json();
            if (data.error) throw new Error(data.error);
            todasListas = data.lists;
            todosCards = data.cards;
            construirMenuLateral();
            renderKanban();
        } catch (err) {
            boardContainer.innerHTML = `<div style="color:#f87171;">Erro: ${err.message}</div>`;
        }
    }

    function construirMenuLateral() {
        const ul = filterMenu;
        ul.innerHTML = '<li><button class="filter-btn active" data-list-id="all">📋 Todas as listas</button></li>';
        todasListas.forEach(list => {
            const li = document.createElement('li');
            const btn = document.createElement('button');
            btn.className = 'filter-btn';
            btn.setAttribute('data-list-id', list.id);
            btn.innerHTML = `📌 ${list.name}`;
            btn.onclick = () => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                listaFiltradaId = list.id;
                currentFilterLabel.innerText = `Mostrando: ${list.name}`;
                renderKanban();
            };
            li.appendChild(btn);
            ul.appendChild(li);
        });
        const allBtn = document.querySelector('.filter-btn[data-list-id="all"]');
        if (allBtn) {
            allBtn.onclick = () => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                allBtn.classList.add('active');
                listaFiltradaId = 'all';
                currentFilterLabel.innerText = 'Mostrando: Todas as listas';
                renderKanban();
            };
        }
    }

    function renderKanban() {
        boardContainer.innerHTML = '';
        let listasParaExibir = (listaFiltradaId === 'all') ? todasListas : todasListas.filter(l => l.id === listaFiltradaId);
        if (listasParaExibir.length === 0) {
            boardContainer.innerHTML = '<div>Nenhuma lista encontrada.</div>';
            return;
        }
        const cardsPorLista = {};
        todosCards.forEach(card => {
            if (!cardsPorLista[card.idList]) cardsPorLista[card.idList] = [];
            cardsPorLista[card.idList].push(card);
        });
        listasParaExibir.forEach(list => {
            const cards = cardsPorLista[list.id] || [];
            const colDiv = document.createElement('div');
            colDiv.className = 'column';
            colDiv.innerHTML = `
                <div class="column-header">
                    <span>${escapeHtml(list.name)}</span>
                    <span style="background:#334155; padding:0.2rem 0.6rem; border-radius:1rem;">${cards.length}</span>
                </div>
                <div class="cards-list" id="list-${list.id}">
                    ${cards.length === 0 ? '<div class="empty-column">Sem cards</div>' : ''}
                </div>
            `;
            const cardsContainer = colDiv.querySelector('.cards-list');
            cards.forEach(card => {
                const cardDiv = document.createElement('div');
                cardDiv.className = 'card-item';
                cardDiv.onclick = () => abrirModalDetalhes(card.id);
                let labelsHtml = '';
                if (card.labels && card.labels.length) {
                    labelsHtml = `<div class="card-labels">${card.labels.map(lbl => `<span class="label-badge">${escapeHtml(lbl.name || 'label')}</span>`).join('')}</div>`;
                }
                const descPreview = card.desc ? card.desc.substring(0, 100) : '';
                cardDiv.innerHTML = `
                    <div class="card-title">${escapeHtml(card.name)}</div>
                    ${labelsHtml}
                    <div class="card-desc">${escapeHtml(descPreview)}${card.desc && card.desc.length > 100 ? '…' : ''}</div>
                `;
                cardsContainer.appendChild(cardDiv);
            });
            boardContainer.appendChild(colDiv);
        });
    }

    async function abrirModalDetalhes(cardId) {
        const modal = document.getElementById('cardModal');
        const modalContent = document.getElementById('cardModalContent');
        modalContent.innerHTML = '<div style="text-align:center;">Carregando detalhes...</div>';
        modal.style.display = 'flex';
        try {
            const response = await fetch(`${SCRIPT_URL}?action=cards&cardId=${cardId}`);
            const data = await response.json();
            if (data.error) throw new Error(data.error);
            const card = data.card;
            const comments = data.comments || [];
            let labelsHtml = '';
            if (card.labels && card.labels.length) {
                labelsHtml = `<div style="margin:0.5rem 0;">${card.labels.map(lbl => `<span class="label-badge">${escapeHtml(lbl.name)}</span>`).join('')}</div>`;
            }
            let commentsHtml = '';
            comments.forEach(com => {
                const author = com.memberCreator ? com.memberCreator.fullName : 'Usuário';
                commentsHtml += `<div class="comment"><div class="comment-author">${escapeHtml(author)}</div><div class="comment-text">${escapeHtml(com.data.text)}</div></div>`;
            });
            if (comments.length === 0) commentsHtml = '<div style="color:#64748b;">Nenhum comentário ainda.</div>';
            modalContent.innerHTML = `
                <div class="modal-header">
                    <h2>${escapeHtml(card.name)}</h2>
                    <span class="close-modal" id="closeCardModal">&times;</span>
                </div>
                <div><strong>Descrição:</strong><br>${escapeHtml(card.desc || 'Sem descrição')}</div>
                ${labelsHtml}
                <div><a href="${card.url}" target="_blank" style="color:#4f46e5;">🔗 Abrir no Trello →</a></div>
                                    <div class="comments-section">
                        <h3>💬 Comentários</h3>
                        <div id="commentsList">${commentsHtml}</div>
                        <div class="new-comment-form" style="flex-wrap: wrap; gap: 0.5rem;">
                            <input type="text" id="newCommentName" placeholder="Seu nome" style="flex: 1; min-width: 120px;">
                            <input type="text" id="newCommentText" placeholder="Escreva um comentário..." style="flex: 2; min-width: 180px;">
                            <button id="sendCommentBtn" style="white-space: nowrap;">Enviar</button>
                        </div>
                    </div>            `;
            document.getElementById('closeCardModal').onclick = () => modal.style.display = 'none';
            const sendBtn = document.getElementById('sendCommentBtn');
            const commentInput = document.getElementById('newCommentText');
                        const commentNameInput = document.getElementById('newCommentName');
            const commentTextInput = document.getElementById('newCommentText');
            
            sendBtn.onclick = async () => {
                const name = commentNameInput.value.trim();
                const text = commentTextInput.value.trim();
                if (!text) return;
                if (!name) {
                    alert('Por favor, informe seu nome antes de comentar.');
                    return;
                }
                sendBtn.disabled = true;
                try {
                    // Monta o comentário com nome do usuário
                    const commentWithName = `**${name}:** ${text}`;
                    const formData = new URLSearchParams();
                    formData.append('action', 'addComment');
                    formData.append('cardId', cardId);
                    formData.append('text', commentWithName);
                    const res = await fetch(SCRIPT_URL, { method: 'POST', body: formData });
                    const result = await res.json();
                    if (result.status === 'success') {
                        commentNameInput.value = '';
                        commentTextInput.value = '';
                        abrirModalDetalhes(cardId); // recarrega os comentários
                    } else {
                        alert('Erro ao comentar');
                    }
                } catch (err) { alert('Falha na conexão'); }
                finally { sendBtn.disabled = false; }
            };
        } catch (err) {
            modalContent.innerHTML = `<div>Erro: ${err.message}</div><button onclick="document.getElementById('cardModal').style.display='none'">Fechar</button>`;
        }
    }

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    window.onclick = (e) => {
        if (e.target === document.getElementById('cardModal')) {
            document.getElementById('cardModal').style.display = 'none';
        }
    };

    carregarBoard();
    setInterval(carregarBoard, 60000);
</script>
</body>
</html>
